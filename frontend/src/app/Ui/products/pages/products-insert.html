<div class="container">
  <!-- Page Header -->
  <div class="page-header">
    <h1 class="page-title">Create New Product</h1>
    <button class="theme-toggle" id="themeToggle">
      <span class="material-symbols-outlined">dark_mode</span>
      <span>Toggle Theme</span>
    </button>
  </div>

  <!-- Main Card -->
  <div class="product-card" style="max-width: 800px; margin: 0 auto">
    <div class="product-content" style="padding: var(--spacing-2xl)">
      <!-- Error Message -->
      @if (errorMessage) {
      <div class="error-message">
        <strong>Error!</strong> {{ errorMessage }}
        <button
          type="button"
          style="float: right; background: none; border: none; cursor: pointer; font-size: 1.2rem"
          (click)="errorMessage = ''"
        >
          &times;
        </button>
      </div>
      }

      <!-- Success Message -->
      @if (successMessage) {
      <div
        style="
          background-color: var(--success-light);
          color: var(--success);
          padding: 12px 16px;
          border-radius: var(--radius-lg);
          margin-bottom: 16px;
          border: 1px solid var(--success);
        "
      >
        <strong>Success!</strong> {{ successMessage }}
        <button
          type="button"
          style="float: right; background: none; border: none; cursor: pointer; font-size: 1.2rem"
          (click)="successMessage = ''"
        >
          &times;
        </button>
      </div>
      }

      <form>
        <!-- Product Name -->
        <div class="form-group">
          <label
            for="name"
            style="
              display: block;
              font-weight: 600;
              margin-bottom: var(--spacing-sm);
              color: var(--text-primary-light);
            "
            class="dark:text-primary-dark"
          >
            Product Name <span style="color: var(--error)">*</span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="product.name"
            placeholder="Enter product name"
            required
            style="
              width: 100%;
              padding: var(--spacing-md);
              border: 1px solid var(--border-light);
              border-radius: var(--radius-md);
              font-size: var(--font-size-base);
              background-color: var(--card-bg-light);
              color: var(--text-primary-light);
              transition: all 0.3s ease;
            "
            class="dark:bg-card-dark dark:border-dark dark:text-primary-dark"
          />
        </div>

        <!-- Brand -->
        <div class="form-group">
          <label
            for="brand"
            style="
              display: block;
              font-weight: 600;
              margin-bottom: var(--spacing-sm);
              color: var(--text-primary-light);
            "
            class="dark:text-primary-dark"
          >
            Brand
          </label>
          <input
            type="text"
            id="brand"
            name="brand"
            [(ngModel)]="product.brand"
            placeholder="Enter brand name"
            style="
              width: 100%;
              padding: var(--spacing-md);
              border: 1px solid var(--border-light);
              border-radius: var(--radius-md);
              font-size: var(--font-size-base);
              background-color: var(--card-bg-light);
              color: var(--text-primary-light);
              transition: all 0.3s ease;
            "
            class="dark:bg-card-dark dark:border-dark dark:text-primary-dark"
          />
        </div>

        <!-- Category -->
        <div class="form-group">
          <label
            for="category_id"
            style="
              display: block;
              font-weight: 600;
              margin-bottom: var(--spacing-sm);
              color: var(--text-primary-light);
            "
            class="dark:text-primary-dark"
          >
            Category <span style="color: var(--error)">*</span>
          </label>
          <select
            id="category_id"
            name="category_id"
            [(ngModel)]="product.category_id"
            required
            style="
              width: 100%;
              padding: var(--spacing-md);
              border: 1px solid var(--border-light);
              border-radius: var(--radius-md);
              font-size: var(--font-size-base);
              background-color: var(--card-bg-light);
              color: var(--text-primary-light);
              cursor: pointer;
              transition: all 0.3s ease;
            "
            class="dark:bg-card-dark dark:border-dark dark:text-primary-dark"
          >
            <option [value]="undefined" disabled>Select a category</option>
            @for (category of categories; track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
            }
          </select>
        </div>

        <!-- Price & Currency Row -->
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: var(--spacing-lg)">
          <!-- Price -->
          <div class="form-group">
            <label
              for="price"
              style="
                display: block;
                font-weight: 600;
                margin-bottom: var(--spacing-sm);
                color: var(--text-primary-light);
              "
              class="dark:text-primary-dark"
            >
              Price <span style="color: var(--error)">*</span>
            </label>
            <input
              type="number"
              id="price"
              name="price"
              [(ngModel)]="product.price"
              placeholder="0.00"
              min="0"
              step="0.01"
              required
              style="
                width: 100%;
                padding: var(--spacing-md);
                border: 1px solid var(--border-light);
                border-radius: var(--radius-md);
                font-size: var(--font-size-base);
                background-color: var(--card-bg-light);
                color: var(--text-primary-light);
                transition: all 0.3s ease;
              "
              class="dark:bg-card-dark dark:border-dark dark:text-primary-dark"
            />
          </div>

          <!-- Currency -->
          <div class="form-group">
            <label
              for="currency"
              style="
                display: block;
                font-weight: 600;
                margin-bottom: var(--spacing-sm);
                color: var(--text-primary-light);
              "
              class="dark:text-primary-dark"
            >
              Currency
            </label>
            <select
              id="currency"
              name="currency"
              [(ngModel)]="product.currency"
              style="
                width: 100%;
                padding: var(--spacing-md);
                border: 1px solid var(--border-light);
                border-radius: var(--radius-md);
                font-size: var(--font-size-base);
                background-color: var(--card-bg-light);
                color: var(--text-primary-light);
                cursor: pointer;
                transition: all 0.3s ease;
              "
              class="dark:bg-card-dark dark:border-dark dark:text-primary-dark"
            >
              <option value="THB">THB ฿</option>
              <option value="USD">USD $</option>
              <option value="EUR">EUR €</option>
            </select>
          </div>
        </div>

        <!-- Stock -->
        <div class="form-group">
          <label
            for="stock"
            style="
              display: block;
              font-weight: 600;
              margin-bottom: var(--spacing-sm);
              color: var(--text-primary-light);
            "
            class="dark:text-primary-dark"
          >
            Stock Quantity <span style="color: var(--error)">*</span>
          </label>
          <input
            type="number"
            id="stock"
            name="stock"
            [(ngModel)]="product.stock"
            placeholder="0"
            min="0"
            required
            style="
              width: 100%;
              padding: var(--spacing-md);
              border: 1px solid var(--border-light);
              border-radius: var(--radius-md);
              font-size: var(--font-size-base);
              background-color: var(--card-bg-light);
              color: var(--text-primary-light);
              transition: all 0.3s ease;
            "
            class="dark:bg-card-dark dark:border-dark dark:text-primary-dark"
          />
        </div>

        <!-- Description -->
        <div class="form-group">
          <label
            for="description"
            style="
              display: block;
              font-weight: 600;
              margin-bottom: var(--spacing-sm);
              color: var(--text-primary-light);
            "
            class="dark:text-primary-dark"
          >
            Description
          </label>
          <textarea
            id="description"
            name="description"
            [(ngModel)]="product.description"
            rows="4"
            placeholder="Enter product description"
            style="
              width: 100%;
              padding: var(--spacing-md);
              border: 1px solid var(--border-light);
              border-radius: var(--radius-md);
              font-size: var(--font-size-base);
              background-color: var(--card-bg-light);
              color: var(--text-primary-light);
              resize: vertical;
              transition: all 0.3s ease;
              font-family: inherit;
            "
            class="dark:bg-card-dark dark:border-dark dark:text-primary-dark"
          ></textarea>
        </div>

        <!-- Image Upload -->
        <div class="form-group">
          <label
            style="
              display: block;
              font-weight: 600;
              margin-bottom: var(--spacing-md);
              color: var(--text-primary-light);
            "
            class="dark:text-primary-dark"
          >
            Product Image
          </label>

          @if (!imagePreview) {
          <div class="image-upload-container">
            <div class="upload-text-container">
              <span class="material-symbols-outlined" style="font-size: 48px; color: var(--primary)"
                >image</span
              >
              <h3 class="upload-title">Upload Product Image</h3>
              <p class="upload-description">PNG, JPG or WEBP (MAX. 5MB)</p>
            </div>
            <label for="fileInput" class="upload-button">
              <span class="material-symbols-outlined" style="margin-right: var(--spacing-xs)"
                >upload</span
              >
              Choose File
            </label>
            <input
              type="file"
              id="fileInput"
              name="fileInput"
              accept="image/*"
              (change)="onImageUpload($event)"
              style="display: none"
            />
          </div>
          }

          <!-- Image Preview -->
          @if (imagePreview) {
          <div
            style="
              position: relative;
              border-radius: var(--radius-xl);
              overflow: hidden;
              border: 2px solid var(--border-light);
            "
            class="dark:border-dark"
          >
            <img
              [src]="imagePreview"
              alt="Preview"
              style="
                width: 100%;
                height: auto;
                max-height: 400px;
                object-fit: cover;
                display: block;
              "
            />
            <button
              type="button"
              (click)="removeImage()"
              style="
                position: absolute;
                top: var(--spacing-md);
                right: var(--spacing-md);
                background-color: var(--error);
                color: white;
                border: none;
                border-radius: var(--radius-md);
                padding: var(--spacing-sm) var(--spacing-md);
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: var(--spacing-xs);
                font-weight: 600;
                box-shadow: var(--shadow-md);
                transition: all 0.3s ease;
              "
            >
              <span class="material-symbols-outlined" style="font-size: 18px">close</span>
              Remove
            </button>
          </div>
          }
        </div>

        <!-- Action Buttons -->
        <div
          style="
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-2xl);
            padding-top: var(--spacing-xl);
            border-top: 1px solid var(--border-light);
          "
          class="dark:border-dark"
        >
          <button
            type="button"
            class="add-product-btn"
            (click)="onSaveProduct()"
            [disabled]="isLoading"
            style="flex: 1"
          >
            @if (isLoading) {
            <span class="material-symbols-outlined" style="animation: spin 1s linear infinite"
              >hourglass_empty</span
            >
            <span>Saving...</span>
            } @else {
            <span class="material-symbols-outlined">save</span>
            <span>Save Product</span>
            }
          </button>

          <button
            type="button"
            (click)="onGoBack()"
            [disabled]="isLoading"
            style="
              padding: var(--spacing-md) var(--spacing-xl);
              background-color: var(--card-bg-light);
              border: 1px solid var(--border-light);
              border-radius: var(--radius-lg);
              font-weight: 600;
              cursor: pointer;
              transition: all 0.3s ease;
              color: var(--text-primary-light);
            "
            class="dark:bg-card-dark dark:border-dark dark:text-primary-dark"
          >
            Cancel
          </button>

          <button
            type="button"
            (click)="resetForm()"
            [disabled]="isLoading"
            style="
              padding: var(--spacing-md) var(--spacing-xl);
              background-color: rgba(202, 138, 4, 0.1);
              border: 1px solid var(--warning);
              color: var(--warning);
              border-radius: var(--radius-lg);
              font-weight: 600;
              cursor: pointer;
              transition: all 0.3s ease;
            "
          >
            <span class="material-symbols-outlined" style="font-size: 18px; vertical-align: middle"
              >refresh</span
            >
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  @keyframes spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.1);
  }

  input[type='number']::-webkit-inner-spin-button,
  input[type='number']::-webkit-outer-spin-button {
    opacity: 1;
  }

  .dark input,
  .dark select,
  .dark textarea {
    background-color: var(--card-bg-dark);
    border-color: var(--border-dark);
    color: var(--text-primary-dark);
  }

  .dark .image-upload-container {
    border-color: var(--border-dark);
  }

  @media (max-width: 768px) {
    .form-group {
      padding: var(--spacing-sm) var(--spacing-md);
    }

    div[style*='grid-template-columns: 2fr 1fr'] {
      grid-template-columns: 1fr !important;
    }
  }
</style>
